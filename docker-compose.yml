services:
  # ---- SQL Server Database ----
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: iem-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Ritco2025!@#Secure}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - iem-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- Spring Boot Backend ----
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: iem-backend
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=IemVirunga;encrypt=true;trustServerCertificate=true;"
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME:-sa}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-Ritco2025!@#Secure}"
      JWT_SECRET: "${JWT_SECRET:-aWVtLXZpcnVuZ2Etc3VwZXItc2VjcmV0LWtleS0yMDI0LXZlcnktc2VjdXJl}"
      JWT_EXPIRATION: "${JWT_EXPIRATION:-86400000}"
      SPRING_MAIL_USERNAME: "${MAIL_USERNAME:-iemvirunga96@gmail.com}"
      SPRING_MAIL_PASSWORD: "${MAIL_PASSWORD:-amkjbroxeqvtkelm}"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILE:-dev}"
    ports:
      - "8082:8082"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - iem-network
    restart: unless-stopped

  # ---- React/Vite Frontend ----
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: iem-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - iem-network
    restart: unless-stopped

networks:
  iem-network:
    driver: bridge

volumes:
  sqlserver-data:
